<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피트크루 키우기 · 하이라이트 프로토타입</title><link rel="stylesheet" href="src/style.css"></head><body><header><h1>피트크루<br>키우기</h1><span id="clock">00:00.00</span><button id="pause">일시정지</button><button id="demo">추월 시연</button><button id="restart">새 레이스</button><button id="garageDemo">정비 시연</button></header><main class="game"><img class="approved" src="docs/concepts/approved-main-ui.png" alt="승인된 5인 정비장 전체 구도"><img class="garage-plate" src="assets/garage/clean-plate.webp" alt="분리된 정비장 배경"><canvas id="garage" aria-label="5인 피트크루 프레임 애니메이션 정비장"></canvas><section class="broadcast"><canvas id="race" aria-label="상단 가로칸 2D 경기 하이라이트"></canvas><div class="live"><span>● LIVE</span> <b id="lap">LAP 1 / 3</b><button id="camera">자동 하이라이트</button><button id="speed">속도 ×2</button></div><div id="raceState"></div></section><section class="timing"><h2>실시간 순위</h2><div id="standings"></div><canvas id="map" width="330" height="150" aria-label="실제 차량 위치와 순위 미니맵"></canvas></section><section class="team"><h2>앰버 폭스 레이싱</h2><canvas id="teamCar" width="480" height="180" aria-label="앰버 폭스 팀 차량 이미지"></canvas><div class="car-model">#27 · AF-01</div><strong><span id="rank">3</span>위</strong><p id="pitLabel">본선 주행</p><p id="pitRecord">정비 예정 4.80초</p><button id="pit">피트 진입 예약</button><button id="delay">정비 지연 +2초</button><small id="delayInfo"></small></section><section class="service"><strong id="stage">피트 대기</strong><span id="serviceClock"></span><div class="progress"><div id="serviceBar"></div></div><div id="steps"></div></section><section class="crew"><div>고은채<meter id="crew0" min="0" max="1"></meter></div><div>레오<meter id="crew1" min="0" max="1"></meter></div><div>윤나리<meter id="crew2" min="0" max="1"></meter></div><div>소피아<meter id="crew3" min="0" max="1"></meter></div><div>올리비아<meter id="crew4" min="0" max="1"></meter></div></section><section class="radio"><b>RACE RADIO</b><span id="events"></span></section><button id="stageSpeed" class="stage-control">▶ ×2</button><button id="stageAuto" class="stage-control">AUTO</button><div class="next-pit-label" id="nextPitLabel">다음 피트 · LAP 2</div><button class="race-action" id="raceAction" aria-label="새 레이스 시작"><span>⚑ ⚑</span><b>레이스 시작</b><small>3 LAPS</small></button></main><p class="note" id="assetStatus" role="status">정비 프레임 로딩 중…</p><details class="debug"><summary>디버그 · 정비 프레임 확인</summary><label>단계 <select id="debugPhase"><option value="live">실제 경기</option><option value="idle">대기</option><option value="ready">작업 준비</option><option value="lift-up">리프트 상승</option><option value="work">정비 작업</option><option value="lift-down">리프트 하강</option><option value="release">출발 확인</option><option value="finish">완료</option></select></label><label>프레임 시간 <input id="debugTime" type="range" min="0" max="3" step="0.05" value="0"></label><button id="debugPlay">프레임 재생</button></details><div id="result" hidden><div class="result-card"><span>CHEQUERED FLAG</span><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultList"></div><button id="again">다시 레이스</button></div></div><script type="module" src="src/app.js"></script></body></html>
