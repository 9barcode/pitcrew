<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>피트크루 키우기 · 하이라이트 프로토타입</title><link rel="stylesheet" href="src/style.css"></head><body><main class="game"><img class="approved" src="docs/concepts/approved-main-ui.png" alt="승인된 5인 정비장 전체 구도"><header><h1>피트크루<br>키우기</h1><span id="clock">00:00.00</span><button id="pause">일시정지</button><button id="restart">새 레이스</button></header><section class="broadcast"><canvas id="race" aria-label="상단 가로칸 2D 경기 하이라이트"></canvas><div class="live"><span>● LIVE</span> <b id="lap">LAP 1 / 3</b><button id="camera">자동 하이라이트</button><button id="speed">속도 ×2</button></div><div id="raceState"></div></section><section class="timing"><h2>실시간 순위</h2><div id="standings"></div><canvas id="map" width="330" height="150" aria-label="실제 차량 위치와 순위 미니맵"></canvas></section><section class="team"><h2>앰버 폭스 레이싱</h2><strong><span id="rank">3</span>위</strong><p id="pitLabel">본선 주행</p><p id="pitRecord">정비 예정 4.80초</p><button id="pit">피트 진입 예약</button><button id="delay">정비 지연 +2초</button><small id="delayInfo"></small></section><section class="service"><strong id="stage">피트 대기</strong><span id="serviceClock"></span><div class="progress"><div id="serviceBar"></div></div><div id="steps"></div></section><section class="crew"><div>고은채<meter id="crew0" min="0" max="1"></meter></div><div>레오<meter id="crew1" min="0" max="1"></meter></div><div>윤나리<meter id="crew2" min="0" max="1"></meter></div><div>소피아<meter id="crew3" min="0" max="1"></meter></div><div>올리비아<meter id="crew4" min="0" max="1"></meter></div></section><section class="radio"><b>RACE RADIO</b><span id="events"></span></section></main><p class="note">상단 가로칸: 실제 경기와 연결된 팀별 차량 프레임 하이라이트 / 중앙: 승인 정비장 시안 · 캐릭터 작업 프레임 적용 전</p><div id="result" hidden><div class="result-card"><span>CHEQUERED FLAG</span><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultList"></div><button id="again">다시 레이스</button></div></div><script type="module" src="src/app.js"></script></body></html>
